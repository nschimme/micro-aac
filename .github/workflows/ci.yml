name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  host-build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure and build host tests
        run: |
          mkdir build && cd build
          cmake ..
          make

      - name: Run CTest
        run: |
          cd build
          ctest --output-on-failure

  esp32-qemu-build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Build Example Project
        run: |
          cd examples/encode_benchmark
          pio run -e esp32s3

      - name: Run QEMU Test Runner
        run: |
          ./tests/qemu/run_qemu_test.sh
